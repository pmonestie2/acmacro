[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enb-protocol"
version = "0.1.0"
description = "Shared Earth and Beyond wire protocol and session library"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["enb_protocol*"]

[tool.setuptools.package-data]
enb_protocol = ["py.typed"]
